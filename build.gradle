plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// GameTests see the mod's code and run in dev, but never ship in the release jar.
sourceSets {
    gametest
}

// Dev-only runtime mods (e.g. KubeJS for integration testing): on the run classpath, never in the published metadata.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                name = 'LatvianModder'
                url = 'https://maven.latvian.dev/releases'
            }
        }
        filter {
            includeGroup 'dev.latvian.mods'
        }
    }
}

var withKubeJS = project.dev_with_kubejs.toBoolean()

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            // Otherwise tests would run inside run/world, which is kept for manual testing.
            gameDirectory = project.file('run/gametest')
            // KubeJS breaks GameTest mock players (it sends unguarded packets on login),
            // so with KubeJS installed only the integration tests run.
            systemProperty 'neoforge.enabledGameTestNamespaces', withKubeJS ? "${mod_id}_kubejs" : project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }

    // Plain unit tests (codecs, logic) get Minecraft classes without launching the game.
    addModdingDependenciesTo(sourceSets.test)
    addModdingDependenciesTo(sourceSets.gametest)
}

dependencies {
    gametestImplementation sourceSets.main.output

    // KubeJS bundles its own libraries (jar-in-jar), so transitive Maven dependencies are not needed.
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_min_version}") { transitive = false }
    compileOnly("dev.latvian.mods:rhino:${rhino_min_version}") { transitive = false }
    if (withKubeJS) {
        localRuntime("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
        localRuntime("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            kubejs_version_range   : kubejs_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The game test server reuses its world; world and party SavedData must not leak between runs.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete 'run/gametest/world'
        // Test scripts for the KubeJS integration; KubeJS reads them from the game directory.
        delete 'run/gametest/kubejs/server_scripts'
        if (withKubeJS) {
            copy {
                from 'src/gametest/kubejs'
                into 'run/gametest/kubejs'
            }
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Minecraft's logging config writes logs/ into the working directory; keep it out of the project root.
    workingDir = layout.buildDirectory.dir('test-run').get().asFile
    doFirst { workingDir.mkdirs() }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
