plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// GameTests see the mod's code and run in dev, but never ship in the release jar.
sourceSets {
    gametest
}

// Dev-only runtime mods (e.g. KubeJS for integration testing): on the run classpath, never in the published metadata.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'JourneyMap'
                url = 'https://jm.gserv.me/repository/maven-public/'
            }
        }
        filter {
            includeGroup 'info.journeymap'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'LatvianModder'
                url = 'https://maven.latvian.dev/releases'
            }
        }
        filter {
            includeGroup 'dev.latvian.mods'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com'
            }
        }
        filter {
            includeGroup 'mezz.jei'
        }
    }
}

var withKubeJS = project.dev_with_kubejs.toBoolean()
var withMaps = project.dev_with_maps.toBoolean()
var cameraModArtifacts = [
        shouldersurfing  : ["maven.modrinth:shoulder-surfing-reloaded:${shoulder_surfing_version}"],
        epicfight        : ["maven.modrinth:epic-fight:${epic_fight_version}"],
        realcamera       : ["maven.modrinth:real-camera:${real_camera_version}"],
        betterthirdperson: ["maven.modrinth:better-third-person:${better_third_person_version}"],
        firstpersonmodel : ["maven.modrinth:first-person-model:${first_person_model_version}",
                            "maven.modrinth:not-enough-animations:${not_enough_animations_version}"]
]
var devCameraMods = project.dev_camera_mods.split(',').collect { it.trim() }.findAll { !it.isEmpty() }
devCameraMods.each {
    if (!cameraModArtifacts.containsKey(it)) {
        throw new GradleException("Unknown dev_camera_mods entry '${it}'; known: ${cameraModArtifacts.keySet().join(', ')}")
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // More players for party and dialogue tests: other names (offline UUIDs come from the name) and their own folders.
        client2 {
            client()
            gameDirectory = project.file('run/client2')
            programArguments.addAll '--username', 'Dev2'
        }
        client3 {
            client()
            gameDirectory = project.file('run/client3')
            programArguments.addAll '--username', 'Dev3'
        }
        server {
            server()
            // Its own folder: otherwise it shares logs/latest.log, config and options with runClient.
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // ./gradlew runValidate [-PstoryFolder=<path>]: a server loads the story, writes
        // run/server/logs/storybound-validation.json and exits, failing the task when there are errors.
        validate {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'storybound.validate', 'true'
            if (project.hasProperty('storyFolder')) {
                systemProperty 'storybound.folder', project.file(project.property('storyFolder')).absolutePath
            }
        }
        gameTestServer {
            type = 'gameTestServer'
            // Otherwise tests would run inside run/world, which is kept for manual testing.
            gameDirectory = project.file('run/gametest')
            // KubeJS breaks GameTest mock players (it sends unguarded packets on login),
            // so with KubeJS installed only the integration tests run.
            // With Easy NPC installed, its integration test runs alongside the rest.
            // -PloadTest=true: only the load test (LoadGameTests), which measures the story's tick handlers.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.hasProperty('loadTest') ? "${mod_id}_load" : withKubeJS ? "${mod_id}_kubejs"
                    : (project.dev_with_easynpc.toBoolean() ? "${mod_id},${mod_id}_easynpc" : project.mod_id)
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }

    // Plain unit tests (codecs, logic) get Minecraft classes without launching the game.
    addModdingDependenciesTo(sourceSets.test)
    addModdingDependenciesTo(sourceSets.gametest)
}

dependencies {
    gametestImplementation sourceSets.main.output

    // KubeJS bundles its own libraries (jar-in-jar), so transitive Maven dependencies are not needed.
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_min_version}") { transitive = false }
    compileOnly("dev.latvian.mods:rhino:${rhino_min_version}") { transitive = false }
    if (withKubeJS) {
        localRuntime("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
        localRuntime("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
    }

    // Xaero has no public API artifact: we compile against the mod itself (via Modrinth), so the range in neoforge.mods.toml is pinned.
    compileOnly("maven.modrinth:xaeros-minimap:${xaero_minimap_version}") { transitive = false }
    compileOnly("info.journeymap:journeymap-api-neoforge:${journeymap_api_version}") { transitive = false }
    if (withMaps) {
        localRuntime("maven.modrinth:xaeros-minimap:${xaero_minimap_version}") { transitive = false }
        localRuntime("maven.modrinth:xaeros-world-map:${xaero_worldmap_version}") { transitive = false }
        localRuntime("maven.modrinth:journeymap:${journeymap_version}") { transitive = false }
    }

    // Camera mods: the dialogue camera pauses these through their APIs; compiled against, never shipped.
    compileOnly(cameraModArtifacts.shouldersurfing[0]) { transitive = false }
    compileOnly(cameraModArtifacts.epicfight[0]) { transitive = false }
    devCameraMods.each { mod ->
        cameraModArtifacts[mod].each { localRuntime(it) { transitive = false } }
    }

    // JEI: items quests ask for and give, as recipes of a "Storybound quests" category.
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}") { transitive = false }
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}") { transitive = false }
    if (project.dev_with_jei.toBoolean()) {
        localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    }

    // Cutscene API: play_cutscene, cutscene_finished and in_cutscene go through its server API when it is installed.
    compileOnly("maven.modrinth:cutscene-api:${cutscene_api_version}") { transitive = false }
    if (project.dev_with_cutscenes.toBoolean()) {
        localRuntime("maven.modrinth:cutscene-api:${cutscene_api_version}") { transitive = false }
    }

    // Easy NPC needs no compile-time integration: its NPCs are ordinary entities. Dev runs only.
    if (project.dev_with_easynpc.toBoolean()) {
        localRuntime("maven.modrinth:easy-npc:${easy_npc_version}") { transitive = false }
        localRuntime("maven.modrinth:easy-npc-core:${easy_npc_core_version}") { transitive = false }
        localRuntime("maven.modrinth:easy-npc-config-ui:${easy_npc_config_ui_version}") { transitive = false }
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_url                : mod_url,
            mod_issues_url         : mod_issues_url,
            xaero_minimap_version_range: xaero_minimap_version_range,
            kubejs_version_range   : kubejs_version_range,
            cutscene_api_version_range: cutscene_api_version_range,
            jei_version_range      : jei_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// The example story inside the jar, outside data/ and assets/ so nothing loads it by itself:
// /storybound example install copies it into config/storybound/.
processResources {
    // The license and the notices travel with the jar (GPL-3.0).
    from(['LICENSE', 'NOTICE']) {
        into 'META-INF'
        rename { "${it}_${mod_id}" }
    }
    from('examples/storybound_example') {
        into 'storybound_example'
        exclude 'pack.mcmeta'
    }
    from('examples/storybound_example_resources') {
        into 'storybound_example'
        exclude 'pack.mcmeta'
    }
    // The dev mode builds its forms from the same JSON schemas authors use in VS Code.
    from('schemas') {
        into 'storybound_schemas'
        include '*.schema.json'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The game test server reuses its world; world and party SavedData must not leak between runs.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete 'run/gametest/world'
        // Test scripts for the KubeJS integration; KubeJS reads them from the game directory.
        delete 'run/gametest/kubejs/server_scripts'
        if (withKubeJS) {
            copy {
                from 'src/gametest/kubejs'
                into 'run/gametest/kubejs'
            }
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Minecraft's logging config writes logs/ into the working directory; keep it out of the project root.
    workingDir = layout.buildDirectory.dir('test-run').get().asFile
    doFirst { workingDir.mkdirs() }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
