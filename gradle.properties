org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.256
neo_version_range=[21.1.200,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Optional integrations (compile-only; never bundled)
# The plugin compiles against the oldest supported KubeJS, so it cannot use API newer than the declared range.
kubejs_version_range=[2101.7.0,)
kubejs_min_version=2101.7.0-build.126
rhino_min_version=2100.2.5-build.46
# KubeJS used by dev runs (-Pdev_with_kubejs=true); override both to test another build.
kubejs_version=2101.7.2-build.379
rhino_version=2101.2.8-build.91
dev_with_kubejs=false
# Map integrations: compiled against these, never shipped. dev_with_maps=true also runs them in dev clients.
xaero_minimap_version=neoforge-1.21.1-26.6.0
xaero_minimap_version_range=[26.0,27)
xaero_worldmap_version=neoforge-1.21.1-1.47.0
journeymap_api_version=2.0.0-1.21.1-SNAPSHOT
journeymap_version=1.21.1-6.0.9+neoforge
dev_with_maps=false

