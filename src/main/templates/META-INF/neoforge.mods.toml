modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${mod_issues_url}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayURL = "${mod_url}"
description = '''${mod_description}'''

[[mixins]]
config = "storybound.mixins.json"

# Optional mixins into other mods (@Pseudo): applied only when that mod is installed.
[[mixins]]
config = "storybound.compat.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "kubejs"
type = "optional"
versionRange = "${kubejs_version_range}"
ordering = "NONE"
side = "BOTH"

# Cutscenes from the story: play_cutscene, cutscene_finished, in_cutscene.
[[dependencies.${mod_id}]]
modId = "cutscene_api"
type = "optional"
versionRange = "${cutscene_api_version_range}"
ordering = "NONE"
side = "BOTH"

# Only the client-side map renderers use these; the version range is pinned because we use Xaero's internals.
[[dependencies.${mod_id}]]
modId = "xaerominimap"
type = "optional"
versionRange = "${xaero_minimap_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "journeymap"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"

# The dialogue camera pauses these through their APIs.
[[dependencies.${mod_id}]]
modId = "shouldersurfing"
type = "optional"
versionRange = "[1.21.1-5.0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "epicfight"
type = "optional"
versionRange = "[21.17,)"
ordering = "NONE"
side = "BOTH"

# Items quests ask for and give show as recipes of a "Storybound quests" category.
[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "${jei_version_range}"
ordering = "NONE"
side = "CLIENT"
