modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "kubejs"
type = "optional"
versionRange = "${kubejs_version_range}"
ordering = "NONE"
side = "BOTH"

# Only the client-side map renderers use these; the version range is pinned because we use Xaero's internals.
[[dependencies.${mod_id}]]
modId = "xaerominimap"
type = "optional"
versionRange = "${xaero_minimap_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "journeymap"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"
